services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: rentbox
      POSTGRES_PASSWORD: rentbox
      POSTGRES_DB: rentbox
    ports:
      - "54321:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentbox -d rentbox"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - rentbox_pgdata:/var/lib/postgresql/data

volumes:
  rentbox_pgdata:

