#:schema ./node_modules/wrangler/config-schema.json
name = "cloudflare-docs"
account_id = "b54f07a6c269ecca2fa60f1ae4920c99"
compatibility_date = "2025-06-02"
compatibility_flags = ["nodejs_compat"]
main = "./worker/index.ts"

workers_dev = true
route = { pattern = "developers.cloudflare.com/*", zone_name = "developers.cloudflare.com" }

rules = [
	{ type = "Text", globs = ["**/__redirects"], fallthrough = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true

[[r2_buckets]]
binding = "VENDORED_MARKDOWN"
bucket_name = "vendored-markdown"

[[r2_buckets]]
binding = "INVOICE_PDFS"
bucket_name = "invoice-pdfs"

[[d1_databases]]
binding = "INVOICING_DB"
database_name = "invoicing"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "./worker/invoicing/migrations"

[triggers]
crons = ["*/5 * * * *"]

[vars]
# Required email headers (hard requirement: From and Reply-To)
EMAIL_FROM = "no-reply@domain"
EMAIL_REPLY_TO = "support@domain"

# Controls (provider defaults to stub unless set to 'mailchannels')
EMAIL_PROVIDER = "stub"
EMAIL_MAX_ATTEMPTS = "8"
VIEW_TOKEN_TTL_SECONDS = "604800"

# Base URL used for reminder emails (invoices use the request origin)
APP_BASE_URL = "https://example.invalid"